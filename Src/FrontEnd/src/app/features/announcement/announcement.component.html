<a routerLink="/announcement-form" class="btn btn-primary mb-3">
  <i class="fa fa-plus"></i> Create Announcement
</a>
<div class="card">
  <p-table
      [value]="announcements"
      [paginator]="true"
      [rows]="5"
      [tableStyle]="{ 'min-width': '50rem' }"
      [rowsPerPageOptions]="[5, 10, 20]"
  >
      <ng-template pTemplate="header">
          <tr>
              <th style="width:20%">Title</th>
              <th style="width:30%">Message</th>
              <th style="width:15%">From-Date</th>
              <th style="width:15%">To-Date</th>
              <th style="width:10%">Target Type</th>
              <th style="width:10%">Target Value</th>

          </tr>
      </ng-template>
      <ng-template pTemplate="body" let-announcement>
          <tr>
              <td><i class="fa fa-bullhorn"></i> {{announcement.title }}</td>
              <td>{{ announcement.message }}</td>
              <td>{{ announcement.fromDate | date:'medium' }}</td>
              <td>{{ announcement.toDate | date:'medium' }}</td>
              <td>{{ announcement.targetType }}</td>
              <td>{{ announcement.targetValue }}</td>      
          </tr>
      </ng-template>
  </p-table>
</div>
