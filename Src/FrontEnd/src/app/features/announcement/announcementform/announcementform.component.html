<div class="card p-4 m-2" >
    <a class="d-flex align-items-center mb-3 text-decoration-none" [routerLink]="['/announcements']">
        <i class="bi bi-arrow-left me-2"></i>
        <span>Back to Announcements</span>
    </a>
    <form [formGroup]="announcementForm" (ngSubmit)="submitForm()">
        <div class="col-md-12 mb-3">
            <div class="row mb-3">
                <!-- Target Type -->
                <div class="col-md-6">
                    <label>Target Type</label>
                    <select class="form-select" formControlName="targetType">
                        <option value="" disabled>Select Target Type</option>
                        <option *ngFor="let type of targetTypes" [value]="type">{{ type }}</option>
                    </select>
                </div>
                

                <!-- Target Value: dropdown or input shown conditionally -->
                <div class="col-md-6" *ngIf="shouldShowTargetValueField()">
                    <label>Target Value</label>

                    <!-- UserGroup dropdown -->
                    <select *ngIf="targetTypeValue === 'UserGroup'" class="form-select" formControlName="targetValue">
                        <option value="" disabled>Select User Group</option>
                        <option *ngFor="let group of userGroupOptions" [value]="group">{{ group }}</option>
                    </select>

                    <!-- Employee input -->
                    <input *ngIf="targetTypeValue === 'Employee'" type="text" class="form-control"
                        formControlName="targetValue" placeholder="Enter Employee Code" />
                </div>

                <!-- Hidden field for "All" target type -->
                <input type="hidden" formControlName="targetValue" *ngIf="targetTypeValue === 'All'" />
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>From Date</label>
                    <input type="datetime-local" class="form-control" formControlName="fromDate" />
                </div>
                <div class="col-md-6">
                    <label>To Date</label>
                    <input type="datetime-local" class="form-control" formControlName="toDate" />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Title</label>
                    <input class="form-control" formControlName="title" placeholder="Enter title" />
                </div>
                <div class="col-md-6">
                    <label>Message</label>
                    <textarea rows="3" class="form-control" formControlName="message"
                        placeholder="Enter announcement message"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button class="btn btn-primary" type="submit" [disabled]="announcementForm.invalid">
                Post Announcement
            </button>
        </div>
    </form>
</div>
