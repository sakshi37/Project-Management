<div class="container py-3">
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card job-card p-3">
        <div class="d-flex align-items-center mb-2">
          <iframe
            src="https://calendar.google.com/calendar/embed?src=en.indian%23holiday%40group.v.calendar.google.com&ctz=Asia%2FKolkata"
            style="border: 0" width="100%" height="315" frameborder="0" scrolling="no">
          </iframe>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-4">
      <div class="card job-card p-3">
        <div class="d-flex align-items-center mb-2">
          <div class="company-logo">
            <i class="fa-regular fa-clock fa-xl"></i>
          </div>

          <div class="d-flex justify-content-between w-100">
            <div>
              <h6 class="mb-0 font-weight-bold">Dashboard Login Time</h6>
              <!-- <small class="text-muted">1 days ago</small> -->
            </div>
            <span class="badge badge-pill job-tag" style="background-color: #c5edee; color: #59aaa9;">Active</span>
          </div>
        </div>
        <h5 class="font-weight-normal mb-2">{{ loginTime | date: 'EEE MMM d y HH:mm:ss' }}
        </h5>
      </div>
      <div class="card job-card p-3" *ngIf="userRole === 'User' || userRole === 'HR' || userRole === 'Team Lead'">
        <div class="d-flex align-items-center mb-2">
          <div class="company-logo">
            <i class="fa-solid fa-calendar-days fa-lg"></i>
          </div>

          <div class="d-flex justify-content-between w-100">
            <div>
              <h6 class="mb-0 font-weight-bold">Tasks Assigned</h6>
            </div>
          </div>
          <span class="ham">
            <a [routerLink]="['/holiday']">
              <i class="fa-solid fa-arrow-right-long fa-xl"></i>
            </a>
          </span>
        </div>

        <ng-container>
          <!-- <span class="badge badge-pill job-tag"
                            style="background-color: #c5edee; color: #59aaa9;">Show Tasks</span> -->
          <h5 class="font-weight-normal text-center mb-1">
          </h5>
          <div class="text-center mb-2">
            <img [src]="'https://emp.neosofttech.com/assets/a9ba8aa/assets/images/noProjects.svg'" alt="Holiday Image"
              class="img-fluid rounded" style="max-height: 120px; width: 100%;" />
          </div>
        </ng-container>

      </div>
    </div>

        </div> -->

    <div class="col-md-4 mb-4">
      <div class="card job-card p-3" *ngIf="userRole === 'User' || userRole === 'Team Lead'">
        <div class="d-flex align-items-center mb-2">
          <div class="company-logo">
            <i class="fa-solid fa-bullhorn fa-large"></i>
          </div>

          <div class="d-flex justify-content-between w-100">
            <div>
              <h6 class="mb-0 font-weight-bold">Announcements</h6>
            </div>
            <a [routerLink]="['/dashboard']">
              <i class="fa-solid fa-arrow-right-long fa-xl"></i>
            </a>
          </div>
        </div>
        <!-- <h5 class="font-weight-normal mb-2"></h5> -->

      </div>
      <div class="card job-card p-3" *ngIf="userRole === 'Admin' || userRole === 'HR'">
        <div class="d-flex align-items-center mb-2">
          <div class="company-logo">
            <i class="fa-regular fa-user fa-large"></i>
          </div>

          <div class="d-flex justify-content-between w-100">
            <div>
              <h6 class="mb-0 font-weight-bold">Total No of Employees:- {{ totalEmployees }}</h6>
            </div>
            <span class="ham"> <a [routerLink]="['/employee']">
                <i class="fa-solid fa-ellipsis-vertical fa-xl"></i></a></span>
          </div>
        </div>
        <!-- <h5 class="font-weight-normal mb-2"></h5> -->

      </div>

      <div class="card job-card p-3">
        <div class="d-flex align-items-center mb-2">
          <div class="company-logo">
            <i class="fa-solid fa-calendar-days fa-lg"></i>
          </div>

          <div class="d-flex justify-content-between w-100">
            <div>
              <h6 class="mb-0 font-weight-bold">Upcoming Holiday</h6>
            </div>
            <span class="ham">
              <a [routerLink]="['/holiday']">
                <i class="fa-solid fa-arrow-right-long fa-xl"></i>
              </a>
            </span>

          </div>
        </div>

        <ng-container *ngIf="upcomingHoliday; else noHoliday">

          <h5 class="font-weight-normal text-center mb-1">
            {{ upcomingHoliday.holidayName }}
          </h5>
          <p class="text-muted text-center mb-0">
            {{ upcomingHoliday.holidayDate | date: 'fullDate' }}
          </p>
          <div class="text-center mb-2">
            <img *ngIf="upcomingHoliday.imagePath" [src]="'http://127.0.0.1:8080/' + upcomingHoliday.imagePath"
              alt="Holiday Image" class="img-fluid rounded" style="max-height: 105px; width: 100%;" />
          </div>
        </ng-container>

        <ng-template #noHoliday>
          <p class="text-muted mb-0">No upcoming holidays.</p>
        </ng-template>
      </div>
    </div>


  </div>
</div>
