<!-- Header with Export Button -->
 <!-- Header Row -->
<div class="d-flex justify-content-between align-items-center mb-3 mt-3">
    
    <h5 class="mb-0">Daily Report</h5>
    <button class="btn btn-success" (click)="exportexceldata()">
      <i class="bi bi-file-earmark-excel"></i> Excel
    </button>
  </div>

  <hr class="my-2" />

<!-- Filters Section -->
<div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Date</label>
      <input type="date" class="form-control" [(ngModel)]="reportDate" [max]="todayString" (change)="onDateChange()" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Absence Type</label>
      <select class="form-control" [(ngModel)]="absenceType" (change)="fetchData()">
        <option value="" disabled selected>--Select Type--</option>
        <option value="missPunchOut">Miss Punch Out</option>
        <option value="halfDay">Half Day</option>
      </select>
    </div>
  </div>

<!-- Show Entries & Pagination -->
<div class="d-flex justify-content-between align-items-center mb-2">
  <div class="col-md-2 entries-dropdown">
    <label for="entries">Show</label>
    <select id="entries" [(ngModel)]="itemsPerPage" class="form-control">
      <option *ngFor="let option of itemsPerPageOptions" [value]="option">{{ option }}</option>
    </select>
  </div>
  <div class="pagination-wrapper d-none d-md-block">
    <pagination-controls (pageChange)="currentPage = $event" [autoHide]="true"></pagination-controls>
  </div>
</div>

 <!-- Table --> <div class="row gy-4" *ngIf="records.length">
    <div class="col-12">
      <div>
        <table class="mb-0">
      <thead>
            <tr>
              <th>
                <div class="head-first">Sr. No</div>
              </th>
              <th (click)="sortData('code')">
                <div class="head-other sortable">
                  Code <i class="fas" [ngClass]="getSortIcon('code')"></i>
                </div>
              </th>
              <th (click)="sortData('name')">
                <div class="head-other sortable">
                  Name <i class="fas" [ngClass]="getSortIcon('name')"></i>
                </div>
              </th>
              <th (click)="sortData('departmentName')">
                <div class="head-other sortable">
                  Department <i class="fas" [ngClass]="getSortIcon('departmentName')"></i>
                </div>
              </th>
              <th (click)="sortData('startDate')">
                <div class="head-other sortable">
                  Date <i class="fas" [ngClass]="getSortIcon('startDate')"></i>
                </div>
              </th>
              <th (click)="sortData('startDate')">
                <div class="head-other sortable">
                  In Time <i class="fas" [ngClass]="getSortIcon('startDate')"></i>
                </div>
              </th>
              <th (click)="sortData('endDate')">
                <div class="head-last sortable">
                  Out Time <i class="fas" [ngClass]="getSortIcon('endDate')"></i>
                </div>
              </th>
            </tr>
          </thead>
      <tbody>
            <tr *ngFor="let r of records; let i = index">
              <td>
                <div class="tr-first-child">{{ (currentPage - 1) * itemsPerPage + i + 1 }}</div>
              </td>
              <td>
                <div class="tr-other-child">{{ r.code }}</div>
              </td>
              <td>
                <div class="tr-other-child">{{ r.name }}</div>
              </td>
              <td>
                <div class="tr-other-child">{{ r.departmentName }}</div>
              </td>
              <td>
                <div class="tr-other-child">{{ r.startDate | date: 'yyyy-MM-dd' }}</div>
              </td>
              <td>
                <div class="tr-other-child">{{ r.startDate | date: 'hh:mm a' }}</div>
              </td>
              <td>
                <div class="tr-last-child">{{ r.endDate | date: 'hh:mm a' }}</div>
              </td>
            </tr>
          </tbody>
    </table>

    <!-- Bottom Pagination -->
    <div class="pagination-wrapper">
      <pagination-controls (pageChange)="currentPage = $event" [autoHide]="true"></pagination-controls>
    </div>
  </div>
</div>
