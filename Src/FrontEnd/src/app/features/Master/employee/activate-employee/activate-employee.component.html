<div class="p-3">
  <h4>Request For Activation Of Employee </h4>
  <hr class="my-2">

  <label for="reasonInput">Enter Reason for Activation:</label>
  <textarea
    id="reasonInput"
    class="form-control"
    [(ngModel)]="reason"
    #reasonInput="ngModel"
    name="reason"
    minlength="10"
    required
    rows="3"
    placeholder="Type your reason here..."
    [class.is-invalid]="reasonInput.invalid && (reasonInput.dirty || reasonInput.touched)"
  ></textarea>

  <!-- Validation messages -->
  <div *ngIf="reasonInput.invalid && (reasonInput.dirty || reasonInput.touched)" class="text-danger mt-2">
    <div *ngIf="reasonInput.errors?.['required']">
      Reason is required.
    </div>
    <div *ngIf="reasonInput.errors?.['minlength']">
      Reason must be at least 10 characters.
    </div>
  </div>

  <p class="mt-3">For Employee: <b>{{ data.name }}</b></p>

  <hr class="my-2">

  <div class="d-flex justify-content-between mt-4">
    <button class="btn btn-success" (click)="activate()" [disabled]="reasonInput.invalid">
      Send Request
    </button>
    <button class="btn btn-outline-secondary" (click)="close()">Close</button>
  </div>
</div>
