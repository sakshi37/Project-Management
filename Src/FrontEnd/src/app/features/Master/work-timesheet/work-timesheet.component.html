<p class="fs-4 fw-bold text-primary">Work Timesheet</p>

<!-- Button to open modal -->
<button
  type="button"
  class="btn btn-primary"
  data-bs-toggle="modal"
  data-bs-target="#projectModal"
>
  Add project
</button>

<!-- Modal -->
<div
  class="modal fade"
  id="projectModal"
  tabindex="-1"
  aria-labelledby="projectModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="projectForm" (ngSubmit)="onProjectSubmit()">
        <div class="modal-header">
          <h5 class="modal-title" id="projectModalLabel">Add New Project</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">
          <div class="form-group mb-3">
            <label for="stack">Select Stack</label>
            <ng-select
              [items]="stacks"
              bindLabel="name"
              bindValue="id"
              [multiple]="true"
              placeholder="Choose technology stacks"
              formControlName="StackIds"
              class="form-control"
            >
            </ng-select>
          </div>

          <div class="form-group mb-3">
            <label for="name">Project Name:</label>
            <input
              id="name"
              formControlName="Name"
              type="text"
              class="form-control"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="projectForm.invalid"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div *ngFor="let project of projects" class="card mb-3 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h5 class="card-title mb-1">{{ project.name }}</h5>
        <p class="mb-0 text-muted">Project Id: {{ project.id }}</p>
        <div *ngFor="let stack of project.stack">
          {{ stack.name }}
        </div>
      </div>

      <div>
        <!-- Show Tasks Button -->
        <button
          class="btn btn-outline-primary btn-sm me-2"
          (click)="toggleTaskList(project.id)"
        >
          {{ openProjectId === project.id ? "Hide Tasks" : "Show Tasks" }}
        </button>

        <!-- Add Task Button -->
        <button
          class="btn btn-outline-success btn-sm"
          (click)="toggleAddTaskForm(project.id)"
        >
          {{ addTaskProjectId === project.id ? "Cancel Add Task" : "Add Task" }}
        </button>
      </div>
    </div>

    <!-- Task List Section -->
    <div *ngIf="project.id === openProjectId" class="card-body border-top pt-3">
      <h6 class="text-secondary mb-3">Task List</h6>

      <ng-container *ngFor="let task of taskList">
        <div
          *ngIf="task.projectId === project.id"
          class="d-flex flex-column gap-1 mb-3 border-bottom pb-2"
        >
          <p class="mb-1 fw-semibold">Job ID: {{ task.projectId }}</p>
          <small class="text-muted">
            Activity: {{ task.activity }} | Sequence: {{ task.sequence }} |
            Type: {{ task.type }} | Part: {{ task.part }}
          </small>
        </div>
      </ng-container>
    </div>

    <!-- Add Task Form Section -->
    <div
      *ngIf="project.id === addTaskProjectId"
      class="card-body border-top pt-3"
    >
      <h6 class="text-secondary mb-3">Add New Task</h6>

      <form
        [formGroup]="taskForm"
        (ngSubmit)="onSubmit(project.id)"
        class="mt-4"
      >
        <div class="mb-3">
          <label for="sequence" class="form-label">Task</label>
          <input
            id="sequence"
            type="text"
            class="form-control"
            formControlName="sequence"
          />
        </div>

        <div class="mb-3">
          <label for="part" class="form-label">Activity</label>
          <input
            id="part"
            type="text"
            class="form-control"
            formControlName="activity"
          />
        </div>

        <div class="mb-3">
          <label for="part" class="form-label">Part</label>
          <input
            id="part"
            type="text"
            class="form-control"
            formControlName="part"
          />
        </div>

        <div class="mb-3">
          <label for="type" class="form-label">Type</label>
          <input
            id="type"
            type="text"
            class="form-control"
            formControlName="type"
          />
        </div>

        <div class="col-md-6">
          <label class="form-label">Employee</label>
          <select formControlName="empId" class="form-select rounded-pill">
            <option value="">Employee</option>
            <option *ngFor="let employee of employees" [ngValue]="employee.id">
              {{ employee.name }}
            </option>
          </select>
        </div>

        <button
          type="submit"
          [disabled]="taskForm.invalid"
          class="btn btn-primary"
        >
          Add Task
        </button>
      </form>
    </div>
  </div>
</div>
