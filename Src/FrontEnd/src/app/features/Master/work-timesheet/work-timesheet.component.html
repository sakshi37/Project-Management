<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="width: 30rem">
    <div class="card-body">
      <h4 class="card-title mb-4 text-center">Add New Project</h4>
      <form [formGroup]="projectForm" (ngSubmit)="onProjectSubmit()">
        <div class="form-group mb-3">
          <label for="name">Project Name</label>
          <input
            id="name"
            formControlName="Name"
            type="text"
            class="form-control"
            placeholder="Enter project name"
          />

          <div
            class="text-danger mt-1 small"
            *ngIf="
              projectForm.get('Name')?.touched &&
              projectForm.get('Name')?.invalid
            "
          >
            <div *ngIf="projectForm.get('Name')?.hasError('required')">
              Project name is required.
            </div>
            <div *ngIf="projectForm.get('Name')?.hasError('minlength')">
              Project name must be at least 3 characters long.
            </div>
            <div *ngIf="projectForm.get('Name')?.hasError('maxlength')">
              Project name cannot exceed 50 characters.
            </div>
            <div *ngIf="projectForm.get('Name')?.hasError('pattern')">
              Only letters, numbers, and spaces are allowed.
            </div>
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="stack">Select Stack</label>
          <!-- <ng-select
            [items]="stacks"
            bindLabel="name"
            bindValue="id"
            [multiple]="true"
            placeholder="Choose technology stacks"
            formControlName="StackIds"
            class="custom-ng-select"
          ></ng-select> -->
          <div class="card flex justify-center">
            <p-multiselect
              [options]="stacks"
              bindValue="id"
              optionLabel="name"
              placeholder="Choose technology stacks"
              formControlName="StackIds"
              display="chip"
              class="custom-ng-select"
            />
          </div>
          <div
            class="text-danger mt-1 small"
            *ngIf="
              projectForm.get('StackIds')?.touched &&
              projectForm.get('StackIds')?.hasError('required')
            "
          >
            At least one technology stack must be selected.
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success">Submit Project</button>
        </div>
      </form>
    </div>
  </div>
</div>
