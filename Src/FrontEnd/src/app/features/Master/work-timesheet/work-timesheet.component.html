<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="width: 30rem">
    <div class="card-body">
      <h4 class="card-title mb-4 text-center">Add New Project</h4>
      <form [formGroup]="projectForm" (ngSubmit)="onProjectSubmit()">
        <div class="form-group mb-3">
          <label for="name">Project Name</label>
          <input
            id="name"
            formControlName="Name"
            type="text"
            class="form-control"
            placeholder="Enter project name"
          />
        </div>

        <div class="form-group mb-3">
          <label for="stack">Select Stack</label>
          <ng-select
            [items]="stacks"
            bindLabel="name"
            bindValue="id"
            [multiple]="true"
            placeholder="Choose technology stacks"
            formControlName="StackIds"
            class="custom-ng-select"
          ></ng-select>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success">Submit Project</button>
        </div>
      </form>
    </div>
  </div>
</div>
